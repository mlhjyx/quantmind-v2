# MVP 4.3 sub-iter 7 (iter 72) — GitHub Actions CI workflow
# Wires all 5 CIOrchestrator phases to scripts/ci_run_phase.py via job matrix.
# Per docs/mvp/MVP_4_3_cicd.md §1 + §4 step 7.
#
# Note: this workflow is the CI entry. GitHub-hosted runners do not have the
# production environment (TimescaleDB + Redis + xtquant + Servy), so pre_push
# runs smoke collection/wiring only; true live smoke remains enforced by the
# local Git hook / future self-hosted runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # for review phase gh pr comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_commit:
    name: pre_commit (ruff + collect + llm_imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pre_commit phase
        run: python scripts/ci_run_phase.py --phase pre_commit

  pre_push:
    name: pre_push (X10 + smoke + datapipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5  # X10 scan reads last 5 commit subjects
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Collect recent commit subjects for X10 scan
        id: commits
        run: |
          subjects=$(git log -n 5 --format=%s)
          echo "subjects<<EOF" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Run pre_push phase
        env:
          QM_CI_SMOKE_COLLECT_ONLY: "1"
        run: |
          mapfile -t SUBJECTS < <(git log -n 5 --format=%s)
          python scripts/ci_run_phase.py \
            --phase pre_push \
            --branch "${{ github.ref_name }}" \
            --commit-subjects "${SUBJECTS[@]}"

  regression:
    name: regression (max_diff=0 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run regression phase
        run: python scripts/ci_run_phase.py --phase regression
        # Blocking gate: validates committed cache/baseline/regression_result_*.json
        # artifacts carry recorded max_diff=0 evidence.

  ci_matrix:
    name: ci_matrix (multi-version smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ci_matrix phase
        env:
          QM_CI_SMOKE_COLLECT_ONLY: "1"
        run: python scripts/ci_run_phase.py --phase ci_matrix
