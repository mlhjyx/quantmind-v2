# QuantMind V2 5年回测配置
# 基于pt_live.yaml策略参数，覆盖回测专属设置
# ============================================================
# BACKTEST BASELINE CONFIG — DO NOT change factor set without
# regression baseline refresh (cache/baseline/regression_result_*.json).
#
# Production PT config = configs/pt_live.yaml (CORE3+dv_ttm post Step 6-H).
# This 5yr config preserves CORE5 for historical regression validation.
#
# Refresh procedure: scripts/run_backtest.py --config configs/backtest_5yr.yaml
# Last refresh: 2026-04-28 (22+d stale as of 2026-05-20, awaiting Phase B-2 refresh)
# Plan v8 ref: PLAN_V8_FINAL_CLOSURE_STATUS_2026_05_20.md §3
# ============================================================

strategy:
  name: equal_weight_top20
  factors:
    - {name: turnover_mean_20, direction: -1}
    - {name: volatility_20, direction: -1}
    - {name: reversal_20, direction: 1}
    - {name: amihud_20, direction: 1}
    - {name: bp_ratio, direction: 1}
  compose: equal_weight
  top_n: 20
  rebalance_freq: monthly
  industry_cap: 1.0
  turnover_cap: 0.5
  cash_buffer: 0.0           # 回测无现金缓冲(与历史基准一致)
  size_neutral_beta: 0.0     # 默认关闭（向后兼容）

execution:
  mode: backtest
  slippage:
    mode: volume_impact
    config:
      Y_large: 0.8
      Y_mid: 1.0
      Y_small: 1.5
      base_bps_large: 3.0
      base_bps_mid: 5.0
      base_bps_small: 8.0
      sell_penalty: 1.2
      gap_penalty_factor: 0.5
  costs:
    commission_rate: 0.0000854
    min_commission: 5.0
    stamp_tax: historical
    stamp_tax_rate: 0.0005
    transfer_fee_rate: 0.00001
  pms:
    enabled: true
    exec_mode: same_close
    tiers:
      - {gain: 0.30, drawdown: 0.15}
      - {gain: 0.20, drawdown: 0.12}
      - {gain: 0.10, drawdown: 0.10}

universe:
  exclude_st: true
  exclude_bj: true
  exclude_suspended: true
  exclude_new_stock: true
  min_listing_days: 60

backtest:
  initial_capital: 1000000
  benchmark: "000300.SH"
  lot_size: 100
  volume_cap_pct: 0.10

data:
  start_date: "2021-01-01"
  end_date: "2025-12-31"
