- `docs/V3_SKILL_HOOK_AGENT_INVOCATION_MAP.md` §5.1 / §5.2 / §5.3 cross-cutting layer ownership\r
- `.agents/skills/quantmind-v3-anti-pattern-guard/SKILL.md` — V3 anti-pattern knowledge layer\r
- `.agents/skills/quantmind-v3-sprint-closure-gate/SKILL.md` — sprint closure criteria knowledge layer\r
- `.codex/agents/quantmind-redline-guardian.md` — 5/5 红线 mutation gating (complementary, distinct scope)\r
- `.codex/agents/quantmind-cite-source-verifier.md` — cross-source cite verification (complementary, distinct scope)\r
- `AGENTS.md` 2026-04-15 directive — role-play domain agent retirement context"""
